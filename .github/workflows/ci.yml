name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 binutils
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: test
        run: make test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: test
        run: make test
